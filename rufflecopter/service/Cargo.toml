[package]
name = "rufflecopter"
version = "0.1.0"
edition = "2024"

[dependencies]
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle.git", tag = "v0.6.0" }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
anyhow = "1"
url = "2.5.8"
async-channel = "2.5.0"
tokio = { version = "1.49.0", features = ["full"] }
async-io = "2.6.0"
futures-lite = "2.6.1"
nix = { version = "0.31.1", features = ["socket"] }
winit = "0.30.12"
fork = "0.6.0"
reqwest = { version = "0.13.2", features = ["blocking"], default-features = false }
bytes = "1.11.1"
libc = "0.2.189"

[patch.crates-io]
swf = { git = "https://github.com/ruffle-rs/ruffle.git", tag = "v0.6.0" }
